[workspace]
channels = ["conda-forge"]
name = "reproseed"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
compare-followup = "datalad run -m compare-native-and-torch-hosts --explicit -i host-results -i analyze_followup.py -i followup-provenance.json -o followup-summary.json -o analysis.txt sh -c 'python analyze_followup.py > analysis.txt'"
reproduce-performance = "datalad rerun 9367368"

existing-analysis = "datalad run -m cross-thread-host-analysis --explicit -i cross-host-inputs -i analyze_existing.py -o followup-results/existing-cross-thread-host.json python analyze_existing.py"
performance = "datalad run -m native-compute-performance --explicit -i pixi.toml -i pixi.lock -i benchmark -o followup-results/performance python benchmark/run_performance.py"
torch-performance = "datalad run -m torch-compute-performance --explicit -i pixi.toml -i pixi.lock -i benchmark -o followup-results/torch python benchmark/run_performance.py --torch"

benchmark-v2 = "datalad run -m finalized-cpu-matrix --explicit -i pixi.toml -i pixi.lock -i benchmark -i execute_recorded.py -o recorded-v2 python execute_recorded.py"
benchmark = "datalad run -m finalized-cpu-matrix --explicit -i pixi.toml -i pixi.lock -i benchmark -i execute_recorded.py -o recorded-v2 python execute_recorded.py"
reproduce = "datalad rerun c3fa2559a942cebce693fd6f9608ee77558855ab"

[dependencies]
python = "==3.13.5"
git = ">=2.56.0,<3"
bats-core = ">=1.14.0,<2"
shellcheck = ">=0.11.0,<0.12"

[pypi-dependencies]
datalad = ">=1.6.5, <2"
git-annex = ">=10.20250721, <11"
con-duct = ">=0.23.0, <0.24"
numpy = "==2.4.2"
threadpoolctl = "==3.6.0"
mkl = "==2025.2.0"
mkl-include = "==2025.2.0"
intel-openmp = "==2025.3.3"
intel-cmplr-lib-ur = "==2025.3.3"
tbb = "==2022.3.1"
tcmlib = "==1.5.0"
umf = "==1.0.3"

[feature.torch.pypi-dependencies]
torch = { version = "==2.9.1+cpu", index = "https://download.pytorch.org/whl/cpu" }

[environments]
default = { features = [], solve-group = "main" }
torch = { features = ["torch"], solve-group = "main" }

[feature.torch.tasks]
reproduce-torch = "datalad rerun cdbe0ad921eb7acb4600726c60eb07e619eae459"
